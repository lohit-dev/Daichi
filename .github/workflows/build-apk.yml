name: Build and Attach APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.2.21
  NODE_VERSION: 22
  JAVA_VERSION: 17

jobs:
  validate:
    name: Validate JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Check formatting and lint
        run: bun run lint

  build-apk:
    name: Generate and build release APK
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Generate Android project from Expo config
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: >-
          ./gradlew :app:assembleRelease
          --no-daemon
          --no-parallel
          --max-workers=2
          --stacktrace
          "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
          -PreactNativeArchitectures=arm64-v8a
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          -Pandroid.enableBundleCompression=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daichi-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
