name: Build and Attach APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0
  NODE_VERSION: 22
  JAVA_VERSION: 17

jobs:
  validate:
    name: Validate JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Check formatting and lint
        run: bun run lint

  build-apk:
    name: Generate and build release APK
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Generate Android project from Expo config
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: |
          set -euo pipefail

          app_version="$(node -p "require('../app.json').expo.version")"
          release_dir="app/build/outputs/apk/release"

          # One minified release build. The Expo config plugin adds ABI splits,
          # so R8 runs once while Gradle emits all requested APK variants.
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            --stacktrace \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true \
            -Pandroid.enableBundleCompression=true

          copy_variant() {
            local pattern="$1"
            local label="$2"
            local source
            source="$(find "${release_dir}" -maxdepth 1 -type f -name "*${pattern}*release*.apk" -print -quit)"
            if [[ -z "${source}" ]]; then
              echo "Could not find APK variant matching: ${pattern}" >&2
              find "${release_dir}" -maxdepth 1 -type f -name '*.apk' -print >&2
              exit 1
            fi
            cp "${source}" "${release_dir}/Daichi-v${app_version}-${label}.apk"
          }

          copy_variant "arm64-v8a" "arm64-v8a"
          copy_variant "armeabi-v7a" "armeabi-v7a"
          copy_variant "universal" "universal"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daichi-release-apks
          path: android/app/build/outputs/apk/release/Daichi-v*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/Daichi-v*.apk
